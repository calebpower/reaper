# A tenant keeping build output out of the forward sync. Patterns are rsync's,
# uninterpreted here: the framework does not know what any of them mean.

schema = 1
project = "excludes-things"
guests = ["some-guest"]
exec = "host"

[run]
cmd = "make check"

[sync]
exclude = ["/target/", "*.tmp", ".venv/"]
