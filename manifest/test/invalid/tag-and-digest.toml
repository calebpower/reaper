# Both a tag and a digest. Rejected even though the digest would win at pull
# time: the tag is unverified, can drift, and reads as though it were checked.

schema = 1
project = "tagged-and-pinned"
guests = ["some-guest"]
exec = "container"

[build]
image = "docker.io/library/example:latest@sha256:deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
cmd = "make build"

[run]
cmd = "make e2e"
