# A Rust command-line tool with no server, no database and no pod. Its state is
# an embedded-SQLite cache and fixture trees on disk.
#
# The interesting half is that it runs on two guests for two different reasons,
# with two different execution modes -- most of its suite is portable, and one
# suite is gated on the host operating system and can only run natively.
#
# Illustrative. Not verified against a live session -- see README.md.

schema = 1
project = "bgone"

# Native execution. The suite gated on this operating system reads the host's
# own package tree, so there is nothing a container could stand in for; and
# this guest's container engine cannot run native binaries in any case.
[[guests]]
name = "freebsd-15.1"
exec = "host"

# The portable majority of the suite, in a pinned toolchain image. Same
# commands, same caches -- only the execution mode and the toolchain differ.
[[guests]]
name = "ubuntu-26.04"
exec = "container"
build = { image = "docker.io/library/rust@sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769" }

# Defaults both guests inherit. Neither overrides them.
[build]
cmd = "cargo build --locked --tests"
cache = ["cargo", "target"]

[run]
cmd = "cargo test --locked"
# No images at all. A tenant that runs no containers declares none, and the
# pre-pull step is skipped rather than being handed an empty ritual.

[reset]
datasets = ["state"]

[resources]
cores = 4
ram_gb = 8

[profiles.dev]
ttl = "2h"
warm_cache = true

[profiles.nightly]
ttl = "12h"
warm_cache = false
