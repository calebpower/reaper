# A JVM web service: database, mail catcher and application in one container
# pod, driven by browser automation from inside that pod.
#
# Illustrative. Not verified against a live session -- see README.md in this
# directory before copying anything here.

schema: 1
project: yasss

# One guest, and every setting below applies to it. The shorthand form.
guests: [ubuntu-26.04]

# The toolchain arrives as a pinned image and the guest template stays generic.
exec: container

build:
  # NOTE: a JDK alone is not sufficient for this project -- its Gradle build
  # also runs a frontend bundler, so the real builder image needs a JavaScript
  # runtime too. Pinned here as the plain JDK to keep the example honest about
  # what it is: a shape, not a working configuration. See README.md.
  # eclipse-temurin 17-jdk, resolved 2026-08-12.
  image: docker.io/library/eclipse-temurin@sha256:f9b295135b39ed8c650c713c6116600dd4c39ac5f3883f566d96fdec917ce3b2
  cmd: ./gradlew --quiet shadowJar
  cache: [gradle]

run:
  # Opaque to reaper. That this string happens to name stages is the tenant's
  # business; the framework never learns what a stage is.
  cmd: e2e/run.sh --only ${STAGES:-journeys}

  # Pre-pulled into tank/images on first `up`, so no run pays a registry
  # round-trip. The application's own image is built in-session from the JRE
  # base below, which is why the base is listed and the application is not.
  images:
    - docker.io/library/mariadb@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    - docker.io/axllent/mailpit@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    - docker.io/library/node@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    - docker.io/library/eclipse-temurin@sha256:56cd3dfd4e99fed05a153a717847950a31b83621b62ef25a09f75bc4e5e8b67e
    - mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e

reset:
  # The database data directory and the application's file storage. Whatever
  # the stack built the first time it came up -- hostile charset included --
  # is what rollback returns to.
  datasets: [state]

resources:
  cores: 4
  ram_gb: 8

profiles:
  dev:
    ttl: 2h
    warm_cache: true
  nightly:
    ttl: 12h
    # Cold, so a warm cache can never be the reason a nightly run passed.
    warm_cache: false
    env:
      JOURNEY_ITERATIONS: "2000"
