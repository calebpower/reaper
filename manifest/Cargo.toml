[package]
name = "reaper-manifest"
description = "Reads and validates a reaper tenant manifest."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The crate keeps its schema, worked examples and fixtures alongside its source.
# Cargo would otherwise try to read manifest/examples/ as example *binaries*;
# they are YAML, so nothing would come of it, but saying so is cheaper than
# leaving a reader to wonder.
autoexamples = false

[dependencies]
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"

[[bin]]
name = "reaper-manifest-validate"
path = "src/bin/reaper-manifest-validate.rs"
