[package]
name = "reaper"
description = "Ephemeral test-VM harness for the pre-push loop."
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reaper-core = { path = "../core" }
reaper-manifest = { path = "../manifest" }
reaper-providers = { path = "../providers/registry" }
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
# The stand-in hypervisor, so the whole binary can be driven end to end
# without one existing.
reaper-providers = { path = "../providers/registry", features = ["mock"] }
libc = "0.2"

[[bin]]
name = "reaper"
path = "src/main.rs"
