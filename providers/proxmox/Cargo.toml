[package]
name = "reaper-provider-proxmox"
description = "Proxmox VE provider for reaper."
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes the stand-in API so other crates can test against it.
mock = []

[dependencies]
reaper-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
# rustls is ureq's default TLS provider; native-tls is banned project-wide so
# that a build host's OpenSSL differences never become a portability problem.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
